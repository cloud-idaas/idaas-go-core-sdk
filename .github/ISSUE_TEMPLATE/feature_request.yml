name: Feature request
description: Suggest a new feature or improvement for the SDK
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please search existing issues first to
        avoid duplicates.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? What's blocking you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API or behavior you'd like. Code sketches welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you've tried.
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Public API change (adds/changes exported symbols)
        - Internal-only
        - Docs / examples
        - Other
  - type: checkboxes
    id: cross-lang
    attributes:
      label: Cross-language alignment
      options:
        - label: This feature should align with the Java / Python SDK where applicable
          required: false
